name: CI

on:
  push:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check
        uses: actions/checkout@v6.0.1

      - name: Python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: 3.14.2
          architecture: x64

      - name: Setup
        run: |
          pip3 install pyinstaller==6.17.0 numpy==2.3.5 opencv-python==5.0.0-alpha pillow==12.0.0 torch==2.9.1 torchvision==0.24.1
          pyinstaller A.py

      - name: File
        uses: actions/upload-artifact@v6.0.0
        with:
          name: A
          path: dist/A/