name: CI

on:
  push:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check
        uses: actions/checkout@v7.0.1

      - name: Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: 3.15.1
          architecture: x64

      - name: Setup
        run: |
          pip3 install pyinstaller==6.22.3 numpy==2.5.4 opencv-python==5.0.0.93 pillow==13.0.0 torch==2.13.0 torchvision==0.28.0
          pyinstaller A.py

      - name: File
        uses: actions/upload-artifact@v7.0.2
        with:
          name: A
          path: dist/A/