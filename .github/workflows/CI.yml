name: CI

on:
  push:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check
        uses: actions/checkout@v3.2.0

      - name: Setup
        run: |
          pip3 install pyinstaller==5.7.0 numpy==1.24.0 opencv-python==4.6.0.66 pillow==9.3.0 torch==1.10.2 torchvision==0.11.3
          pyinstaller A.py

      - name: File
        uses: actions/upload-artifact@v3.1.1
        with:
          name: A
          path: dist/A/