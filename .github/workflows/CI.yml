name: CI

on:
  push:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check
        uses: actions/checkout@v4.1.1

      - name: Python
        uses: actions/setup-python@v5.0.0
        with:
          python-version: 3.11.8
          architecture: x64

      - name: Setup
        run: |
          pip3 install pyinstaller==6.4.0 numpy==1.26.4 opencv-python==4.9.0.80 pillow==10.2.0 torch==2.2.1 torchvision==0.17.1
          pyinstaller A.py

      - name: File
        uses: actions/upload-artifact@v4.3.1
        with:
          name: A
          path: dist/A/