name: CI

on:
  push:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check
        uses: actions/checkout@v3.5.0

      - name: Python
        uses: actions/setup-python@v4.5.0
        with:
          python-version: 3.11.3
          architecture: x64

      - name: Setup
        run: |
          pip3 install pyinstaller==5.9.0 numpy==1.24.2 opencv-python==4.7.0.72 pillow==9.5.0 torch==2.0.0 torchvision==0.15.1
          pyinstaller A.py

      - name: Zip
        uses: thedoctor0/zip-release@0.7.1
        with:
          filename: A.zip
          path: ./dist/A/.

      - name: File
        uses: actions/upload-artifact@v3.1.2
        with:
          name: File A
          path: A.zip