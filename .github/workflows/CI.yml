name: CI

on:
  push:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check
        uses: actions/checkout@v4.2.2

      - name: Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: 3.13.3
          architecture: x64

      - name: Setup
        run: |
          pip3 install pyinstaller==6.13.0 numpy==2.2.5 opencv-python==4.11.0.86 pillow==11.2.1 torch==2.7.0 torchvision==0.22.0
          pyinstaller A.py

      - name: File
        uses: actions/upload-artifact@v4.6.2
        with:
          name: A
          path: dist/A/