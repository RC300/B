name: CI

on:
  push:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check
        uses: actions/checkout@v4.1.7

      - name: Python
        uses: actions/setup-python@v5.1.1
        with:
          python-version: 3.12.4
          architecture: x64

      - name: Setup
        run: |
          pip3 install pyinstaller==6.9.0 numpy==1.26.4 opencv-python==4.10.0.84 pillow==10.4.0 torch==2.3.1 torchvision==0.18.1
          pyinstaller A.py

      - name: File
        uses: actions/upload-artifact@v4.3.4
        with:
          name: A
          path: dist/A/