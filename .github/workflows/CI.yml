name: CI

on:
  push:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check
        uses: actions/checkout@v6.0.3

      - name: Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.6
          architecture: x64

      - name: Setup
        run: |
          pip3 install pyinstaller==6.20.0 numpy==2.5.0rc1 opencv-python==4.13.0.92 pillow==12.2.0 torch==2.12.0 torchvision==0.27.0
          pyinstaller A.py

      - name: File
        uses: actions/upload-artifact@v7.0.1
        with:
          name: A
          path: dist/A/