name: CI

on:
  push:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check
        uses: actions/checkout@v4.2.2

      - name: Python
        uses: actions/setup-python@v5.5.0
        with:
          python-version: 3.12.9
          architecture: x64

      - name: Setup
        run: |
          pip3 install pyinstaller==6.12.0 numpy==2.2.4 opencv-python==4.11.0.86 pillow==11.1.0 torch==2.6.0 torchvision==0.21.0
          pyinstaller A.py

      - name: File
        uses: actions/upload-artifact@v4.6.2
        with:
          name: A
          path: dist/A/