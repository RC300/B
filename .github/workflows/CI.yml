name: CI

on:
  push:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check
        uses: actions/checkout@v7.0.0

      - name: Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: 3.14.6
          architecture: x64

      - name: Setup
        run: |
          pip3 install pyinstaller==6.21.0 numpy==2.5.0 opencv-python==5.0.0.93 pillow==12.3.0 torch==2.12.1 torchvision==0.27.1
          pyinstaller A.py

      - name: File
        uses: actions/upload-artifact@v7.0.1
        with:
          name: A
          path: dist/A/