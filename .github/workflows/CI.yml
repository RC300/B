name: CI

on:
  push:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check
        uses: actions/checkout@v4.2.2

      - name: Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: 3.13.5
          architecture: x64

      - name: Setup
        run: |
          pip3 install pyinstaller==6.14.2 numpy==2.3.0 opencv-python==4.12.0.88 pillow==11.3.0 torch==2.7.1 torchvision==0.22.1
          pyinstaller A.py

      - name: File
        uses: actions/upload-artifact@v4.6.2
        with:
          name: A
          path: dist/A/