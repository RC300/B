name: CI

on:
  push:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check
        uses: actions/checkout@v4.1.0

      - name: Python
        uses: actions/setup-python@v4.7.1
        with:
          python-version: 3.11.6
          architecture: x64

      - name: Setup
        run: |
          pip3 install pyinstaller==6.0.0 numpy==1.26.0 opencv-python==4.8.1.78 pillow==10.0.1 torch==2.1.0 torchvision==0.16.0
          pyinstaller A.py

      - name: Zip
        uses: thedoctor0/zip-release@0.7.1
        with:
          filename: A.zip
          path: ./dist/A/.

      - name: File
        uses: actions/upload-artifact@v3.1.3
        with:
          name: File A
          path: A.zip