name: CI

on:
  push:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check
        uses: actions/checkout@v3.5.3

      - name: Python
        uses: actions/setup-python@v4.7.0
        with:
          python-version: 3.11.4
          architecture: x64

      - name: Setup
        run: |
          pip3 install pyinstaller==5.13.0 numpy==1.25.2 opencv-python==4.8.0.74 pillow==10.0.0 torch==2.0.1 torchvision==0.15.2
          pyinstaller A.py

      - name: Zip
        uses: thedoctor0/zip-release@0.7.1
        with:
          filename: A.zip
          path: ./dist/A/.

      - name: File
        uses: actions/upload-artifact@v3.1.2
        with:
          name: File A
          path: A.zip