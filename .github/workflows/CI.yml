name: CI

on:
  push:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check
        uses: actions/checkout@v5.0.0

      - name: Python
        uses: actions/setup-python@v6.0.0
        with:
          python-version: 3.14.0
          architecture: x64

      - name: Setup
        run: |
          pip3 install pyinstaller==6.16.0 numpy==2.2.6 opencv-python==4.12.0.88 pillow==11.3.0 torch==2.8.0 torchvision==0.23.0
          pyinstaller A.py

      - name: File
        uses: actions/upload-artifact@v4.6.2
        with:
          name: A
          path: dist/A/