name: CI

on:
  push:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check
        uses: actions/checkout@v4.2.2

      - name: Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: 3.12.8
          architecture: x64

      - name: Setup
        run: |
          pip3 install pyinstaller==6.11.1 numpy==2.2.1 opencv-python==4.10.0.84 pillow==11.1.0 torch==2.5.1 torchvision==0.20.1
          pyinstaller A.py

      - name: File
        uses: actions/upload-artifact@v4.5.0
        with:
          name: A
          path: dist/A/